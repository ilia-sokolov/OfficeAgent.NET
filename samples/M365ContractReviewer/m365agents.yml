# yaml-language-server: $schema=https://aka.ms/m365-agents-toolkits/v1.13/yaml.schema.json
# Visit https://aka.ms/teamsfx-v5.0-guide for details on this file
# Visit https://aka.ms/teamsfx-actions for details on actions
version: v1.13

environmentFolderPath: ./env

# Triggered when 'Provision' is run in Agents Toolkit, or 'atk provision' from the CLI
provision:
  # Creates the app in the Teams Developer Portal
  - uses: teamsApp/create
    with:
      name: Contract Reviewer${{APP_NAME_SUFFIX}}
    writeToEnvironmentFile:
      teamsAppId: TEAMS_APP_ID

  # Registers Microsoft Entra single sign-on for the MCP server. Copilot gets a token for the
  # middle-tier API app (OFFICEAGENT_API_CLIENT_ID) on behalf of the signed-in user and sends
  # it to the server, which exchanges it for Microsoft Graph (On-Behalf-Of).
  - uses: oauth/register
    with:
      name: officeagent
      appId: ${{TEAMS_APP_ID}}
      flow: authorizationCode
      identityProvider: MicrosoftEntra
      baseUrl: ${{OFFICEAGENT_MCP_URL}}
      clientId: ${{OFFICEAGENT_API_CLIENT_ID}}
    writeToEnvironmentFile:
      configurationId: MCP_DA_AUTH_ID_OFFICEAGENT
      applicationIdUri: OFFICEAGENT_SSO_APPLICATION_ID_URI

  # Builds the app package with the values from env/.env.<environment>
  - uses: teamsApp/zipAppPackage
    with:
      manifestPath: ./appPackage/manifest.json
      outputZipPath: ./appPackage/build/appPackage.${{TEAMSFX_ENV}}.zip
      outputFolder: ./appPackage/build

  - uses: teamsApp/validateAppPackage
    with:
      appPackagePath: ./appPackage/build/appPackage.${{TEAMSFX_ENV}}.zip

  - uses: teamsApp/update
    with:
      appPackagePath: ./appPackage/build/appPackage.${{TEAMSFX_ENV}}.zip

  # Sideloads the agent for you, or shares it, depending on AGENT_SCOPE
  - uses: copilotAgent/publish
    with:
      appPackagePath: ./appPackage/build/appPackage.${{TEAMSFX_ENV}}.zip
      scope: ${{AGENT_SCOPE}}
    writeToEnvironmentFile:
      titleId: M365_TITLE_ID
      appId: M365_APP_ID
      shareLink: SHARE_LINK

# Triggered when 'Publish' is run in Agents Toolkit, or 'atk publish' from the CLI
publish:
  - uses: teamsApp/zipAppPackage
    with:
      manifestPath: ./appPackage/manifest.json
      outputZipPath: ./appPackage/build/appPackage.${{TEAMSFX_ENV}}.zip
      outputFolder: ./appPackage/build

  - uses: teamsApp/validateAppPackage
    with:
      appPackagePath: ./appPackage/build/appPackage.${{TEAMSFX_ENV}}.zip

  - uses: teamsApp/update
    with:
      appPackagePath: ./appPackage/build/appPackage.${{TEAMSFX_ENV}}.zip

  # Publishes the agent to the tenant app catalog, for an admin to approve
  - uses: copilotAgent/publish
    with:
      appPackagePath: ./appPackage/build/appPackage.${{TEAMSFX_ENV}}.zip
      scope: tenant
    writeToEnvironmentFile:
      titleId: M365_PUBLISHED_TITLE_ID
      appId: M365_PUBLISHED_APP_ID
