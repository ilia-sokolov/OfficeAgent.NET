name: Bug report
description: Report a defect in OfficeAgent.NET.
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Package version
      placeholder: "1.0.0"
    validations:
      required: true
  - type: dropdown
    id: package
    attributes:
      label: Affected package
      options:
        - OfficeAgent.Abstractions
        - OfficeAgent.AgentFramework
        - OfficeAgent.Core
        - OfficeAgent.Excel
        - OfficeAgent.Mcp
        - OfficeAgent.PowerPoint
        - OfficeAgent.Rendering
        - OfficeAgent.SharePoint
        - OfficeAgent.Word
        - "Multiple / not sure"
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What did you expect, what happened instead, and the smallest repro you can attach. Plan JSON + fixture .docx (or a generator) is ideal.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      placeholder: |
        - OS:
        - .NET runtime (for example 8.0.x or 10.0.x):
        - TFM the consumer targets:
