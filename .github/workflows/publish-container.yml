name: publish container

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Existing release tag version without v, for example 0.9.0'
        required: true

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

jobs:
  publish-container:
    runs-on: ubuntu-latest
    environment: nuget
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: v${{ inputs.version }}

      - name: Validate immutable release source
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version must use major.minor.patch form" >&2
            exit 1
          fi

          RELEASE_TAG="v$RELEASE_VERSION"
          TAG_SHA="$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
          HEAD_SHA="$(git rev-parse HEAD)"
          if [ "$HEAD_SHA" != "$TAG_SHA" ]; then
            echo "Checked-out source $HEAD_SHA does not match $RELEASE_TAG at $TAG_SHA" >&2
            exit 1
          fi

          RELEASED_TAG="$(gh release view "$RELEASE_TAG" --json tagName --jq .tagName)"
          if [ "$RELEASED_TAG" != "$RELEASE_TAG" ]; then
            echo "GitHub release $RELEASE_TAG does not exist" >&2
            exit 1
          fi
          LATEST_TAG="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)"
          if [ "$LATEST_TAG" != "$RELEASE_TAG" ]; then
            echo "$RELEASE_TAG is not the latest published release" >&2
            exit 1
          fi

          echo "version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
          echo "source_sha=$TAG_SHA" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish validated container image
        id: container
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          provenance: mode=max
          sbom: true
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.release.outputs.version }}
            org.opencontainers.image.revision=${{ steps.release.outputs.source_sha }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/officeagent-mcp:${{ steps.release.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/officeagent-mcp:latest

      - name: Attest container build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/officeagent-mcp
          subject-digest: ${{ steps.container.outputs.digest }}
          push-to-registry: true
