name: Publish container image

# Publishes the OfficeAgent MCP server image to GitHub Container Registry
# (ghcr.io/<owner>/officeagent-mcp) so users can deploy it without building.
# Fires on a version tag (v0.2.1, …) and can be run manually.

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag (e.g. 0.2.1)'
        required: true

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.ref || format('refs/tags/v{0}', inputs.tag) }}

      - name: Derive version
        id: v
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="${{ github.event.inputs.tag }}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          EXPECTED_REF="refs/tags/v$VERSION"
          if [ "$GITHUB_REF" != "$EXPECTED_REF" ]; then
            echo "Container workflow must run from $EXPECTED_REF, not $GITHUB_REF" >&2
            exit 1
          fi
          if [ "$(git rev-parse HEAD)" != "$GITHUB_SHA" ]; then
            echo "Checked-out source does not match the workflow source SHA" >&2
            exit 1
          fi

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          provenance: mode=max
          sbom: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/officeagent-mcp:${{ steps.v.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/officeagent-mcp:latest

      - name: Attest container build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/officeagent-mcp
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
