name: publish

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Existing release tag version without v, for example 0.7.0'
        required: true
      dry_run:
        description: >-
          Rehearse the release from the selected branch without publishing: build, test, pack,
          package and verify everything, but attach no assets, create no attestations, push no
          packages and push no image. The version must be the one in Directory.Build.props.
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: nuget     # matches the Trusted Publisher config; enables approval gating
    permissions:
      contents: write          # attach the version-matched release assets
      packages: write          # publish the versioned and latest GHCR image
      id-token: write          # NuGet OIDC and GitHub artifact attestations
      attestations: write      # publish build and SBOM attestations
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # Source Link / deterministic builds
          ref: ${{ inputs.dry_run && github.sha || github.event.release.tag_name || format('v{0}', inputs.version) }}

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Validate release metadata and documentation
        id: release
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || format('v{0}', inputs.version) }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          EXPECTED_REF="refs/tags/$RELEASE_TAG"
          if [ "$DRY_RUN" = "true" ]; then
            # No tag exists yet. The evidence is built for the tag this commit would become;
            # validate_release.py runs on the real release, once the changelog is dated.
            COMMITTED="v$(sed -n 's:.*<Version>\([^<]*\)</Version>.*:\1:p' Directory.Build.props | head -n 1)"
            if [ "$COMMITTED" != "$RELEASE_TAG" ]; then
              echo "Dry run for $RELEASE_TAG, but Directory.Build.props is at $COMMITTED" >&2
              exit 1
            fi
            echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"
            echo "source_ref=$EXPECTED_REF" >> "$GITHUB_OUTPUT"
            echo "::notice::Dry run of $RELEASE_TAG from $GITHUB_REF: nothing will be published"
            exit 0
          fi
          if [ "$GITHUB_REF" != "$EXPECTED_REF" ]; then
            echo "Release workflow must run from $EXPECTED_REF, not $GITHUB_REF" >&2
            exit 1
          fi
          if [ "$(git rev-parse HEAD)" != "$GITHUB_SHA" ]; then
            echo "Checked-out source does not match the workflow source SHA" >&2
            exit 1
          fi
          echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"
          echo "source_ref=$GITHUB_REF" >> "$GITHUB_OUTPUT"
          python scripts/validate_release.py "$RELEASE_TAG"

      - name: Validate MCP Registry manifest
        run: |
          python -m pip install --disable-pip-version-check --require-hashes -r scripts/requirements-ci.txt
          python scripts/validate_server_manifest.py

      # Test the exact tag being published. workflow_dispatch can target a tag
      # that never went through the main build, so the gate has to live here.
      - name: Restore
        run: dotnet restore OfficeAgent.NET.sln --locked-mode

      - name: Audit NuGet dependencies
        run: python scripts/check_vulnerable_packages.py

      - name: Build (Release)
        run: dotnet build OfficeAgent.NET.sln -c Release --no-restore

      - name: Verify generated C# API reference
        run: dotnet run --project tools/OfficeAgent.ApiDocs --configuration Release --no-build -- --check docs/csharp-api.md docs/wire-contract.md

      - name: Test (Release)
        run: dotnet test OfficeAgent.NET.sln -c Release --no-build

      - name: Pack
        run: dotnet pack OfficeAgent.NET.sln -c Release -o ./artifacts --no-build

      - name: Package standalone QuickEdit sample
        run: python scripts/package_samples.py --output artifacts

      - name: Package agent skills
        run: python scripts/package_skills.py --output artifacts

      # Last of the builds: publishing for a runtime identifier restores the server project for it.
      - name: Package standalone server downloads and Claude Desktop bundles
        run: >-
          python scripts/package_standalone.py
          --output artifacts
          --version "${{ steps.release.outputs.version }}"

      - name: Smoke the standalone Linux server with no .NET on the path
        run: >-
          python scripts/smoke_packaged_artifacts.py --standalone
          --artifacts artifacts
          --version "${{ steps.release.outputs.version }}"

      - name: Restore pinned release tools
        run: dotnet tool restore

      - name: Generate release SBOMs
        run: >-
          python scripts/release_evidence.py sbom
          --version "${{ steps.release.outputs.version }}"
          --artifacts artifacts

      - name: Generate and verify release manifest
        run: |
          python scripts/release_evidence.py create \
            --version "${{ steps.release.outputs.version }}" \
            --source-sha "$GITHUB_SHA" \
            --source-ref "${{ steps.release.outputs.source_ref }}" \
            --artifacts artifacts
          python scripts/release_evidence.py verify \
            --repository "$GITHUB_REPOSITORY" \
            --workflow ".github/workflows/publish.yml" \
            --source-sha "$GITHUB_SHA" \
            --source-ref "${{ steps.release.outputs.source_ref }}" \
            --artifacts artifacts

      - name: Test sample, skill, and release evidence failure boundaries
        run: python -m unittest tests/test_agent_evaluation.py tests/test_package_samples.py tests/test_package_skills.py tests/test_package_standalone.py tests/test_release_evidence.py -v

      - name: Verify standalone QuickEdit sample with installed packages
        run: python scripts/verify_quickedit_sample.py --artifacts artifacts --version "${{ steps.release.outputs.version }}"

      - name: Verify integration kit with installed packages
        run: python scripts/verify_integration_kit.py --artifacts artifacts --version "${{ steps.release.outputs.version }}"

      - name: Attest release build provenance
        if: ${{ !inputs.dry_run }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: artifacts/*

      - name: Attest OfficeAgent.Abstractions SBOM
        if: ${{ !inputs.dry_run }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            artifacts/OfficeAgent.Abstractions.${{ steps.release.outputs.version }}.nupkg
            artifacts/OfficeAgent.Abstractions.${{ steps.release.outputs.version }}.snupkg
          sbom-path: artifacts/OfficeAgent.Abstractions.${{ steps.release.outputs.version }}.cdx.json

      - name: Attest OfficeAgent.AgentFramework SBOM
        if: ${{ !inputs.dry_run }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            artifacts/OfficeAgent.AgentFramework.${{ steps.release.outputs.version }}.nupkg
            artifacts/OfficeAgent.AgentFramework.${{ steps.release.outputs.version }}.snupkg
          sbom-path: artifacts/OfficeAgent.AgentFramework.${{ steps.release.outputs.version }}.cdx.json

      - name: Attest OfficeAgent.Core SBOM
        if: ${{ !inputs.dry_run }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            artifacts/OfficeAgent.Core.${{ steps.release.outputs.version }}.nupkg
            artifacts/OfficeAgent.Core.${{ steps.release.outputs.version }}.snupkg
          sbom-path: artifacts/OfficeAgent.Core.${{ steps.release.outputs.version }}.cdx.json

      - name: Attest OfficeAgent.Excel SBOM
        if: ${{ !inputs.dry_run }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            artifacts/OfficeAgent.Excel.${{ steps.release.outputs.version }}.nupkg
            artifacts/OfficeAgent.Excel.${{ steps.release.outputs.version }}.snupkg
          sbom-path: artifacts/OfficeAgent.Excel.${{ steps.release.outputs.version }}.cdx.json

      - name: Attest OfficeAgent.Excel.Calculation SBOM
        if: ${{ !inputs.dry_run }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            artifacts/OfficeAgent.Excel.Calculation.${{ steps.release.outputs.version }}.nupkg
            artifacts/OfficeAgent.Excel.Calculation.${{ steps.release.outputs.version }}.snupkg
          sbom-path: artifacts/OfficeAgent.Excel.Calculation.${{ steps.release.outputs.version }}.cdx.json

      - name: Attest OfficeAgent.Mcp SBOM
        if: ${{ !inputs.dry_run }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            artifacts/OfficeAgent.Mcp.${{ steps.release.outputs.version }}.nupkg
            artifacts/OfficeAgent.Mcp.${{ steps.release.outputs.version }}.snupkg
          sbom-path: artifacts/OfficeAgent.Mcp.${{ steps.release.outputs.version }}.cdx.json

      - name: Attest OfficeAgent.PowerPoint SBOM
        if: ${{ !inputs.dry_run }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            artifacts/OfficeAgent.PowerPoint.${{ steps.release.outputs.version }}.nupkg
            artifacts/OfficeAgent.PowerPoint.${{ steps.release.outputs.version }}.snupkg
          sbom-path: artifacts/OfficeAgent.PowerPoint.${{ steps.release.outputs.version }}.cdx.json

      - name: Attest OfficeAgent.Rendering SBOM
        if: ${{ !inputs.dry_run }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            artifacts/OfficeAgent.Rendering.${{ steps.release.outputs.version }}.nupkg
            artifacts/OfficeAgent.Rendering.${{ steps.release.outputs.version }}.snupkg
          sbom-path: artifacts/OfficeAgent.Rendering.${{ steps.release.outputs.version }}.cdx.json

      - name: Attest OfficeAgent.SharePoint SBOM
        if: ${{ !inputs.dry_run }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            artifacts/OfficeAgent.SharePoint.${{ steps.release.outputs.version }}.nupkg
            artifacts/OfficeAgent.SharePoint.${{ steps.release.outputs.version }}.snupkg
          sbom-path: artifacts/OfficeAgent.SharePoint.${{ steps.release.outputs.version }}.cdx.json

      - name: Attest OfficeAgent.Word SBOM
        if: ${{ !inputs.dry_run }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            artifacts/OfficeAgent.Word.${{ steps.release.outputs.version }}.nupkg
            artifacts/OfficeAgent.Word.${{ steps.release.outputs.version }}.snupkg
          sbom-path: artifacts/OfficeAgent.Word.${{ steps.release.outputs.version }}.cdx.json

      - name: Attest Word review skill SBOM
        if: ${{ !inputs.dry_run }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: artifacts/word-document-review.zip
          sbom-path: artifacts/word-document-review.${{ steps.release.outputs.version }}.cdx.json

      - name: Attest OfficeAgent integration skill SBOM
        if: ${{ !inputs.dry_run }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: artifacts/officeagent-integration.zip
          sbom-path: artifacts/officeagent-integration.${{ steps.release.outputs.version }}.cdx.json

      - name: Attest standalone QuickEdit sample SBOM
        if: ${{ !inputs.dry_run }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: artifacts/quickedit-sample.zip
          sbom-path: artifacts/quickedit-sample.${{ steps.release.outputs.version }}.cdx.json

      - name: Attest standalone Windows x64 server SBOM
        if: ${{ !inputs.dry_run }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            artifacts/officeagent-mcp-win-x64.zip
            artifacts/officeagent-mcp-win-x64.mcpb
          sbom-path: artifacts/officeagent-mcp-win-x64.${{ steps.release.outputs.version }}.cdx.json

      - name: Attest standalone Windows Arm64 server SBOM
        if: ${{ !inputs.dry_run }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            artifacts/officeagent-mcp-win-arm64.zip
            artifacts/officeagent-mcp-win-arm64.mcpb
          sbom-path: artifacts/officeagent-mcp-win-arm64.${{ steps.release.outputs.version }}.cdx.json

      - name: Attest standalone macOS x64 server SBOM
        if: ${{ !inputs.dry_run }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            artifacts/officeagent-mcp-osx-x64.tar.gz
            artifacts/officeagent-mcp-osx-x64.mcpb
          sbom-path: artifacts/officeagent-mcp-osx-x64.${{ steps.release.outputs.version }}.cdx.json

      - name: Attest standalone macOS Arm64 server SBOM
        if: ${{ !inputs.dry_run }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            artifacts/officeagent-mcp-osx-arm64.tar.gz
            artifacts/officeagent-mcp-osx-arm64.mcpb
          sbom-path: artifacts/officeagent-mcp-osx-arm64.${{ steps.release.outputs.version }}.cdx.json

      - name: Attest standalone Linux x64 server SBOM
        if: ${{ !inputs.dry_run }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: artifacts/officeagent-mcp-linux-x64.tar.gz
          sbom-path: artifacts/officeagent-mcp-linux-x64.${{ steps.release.outputs.version }}.cdx.json

      - name: Attest standalone Linux Arm64 server SBOM
        if: ${{ !inputs.dry_run }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: artifacts/officeagent-mcp-linux-arm64.tar.gz
          sbom-path: artifacts/officeagent-mcp-linux-arm64.${{ steps.release.outputs.version }}.cdx.json

      - name: Attach original artifacts and verification materials to release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || format('v{0}', inputs.version) }}
        run: gh release upload "$RELEASE_TAG" artifacts/* --clobber

      - name: Verify complete release attachment set
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || format('v{0}', inputs.version) }}
        run: |
          gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' > "$RUNNER_TEMP/release-assets.txt"
          python scripts/release_evidence.py verify \
            --repository "$GITHUB_REPOSITORY" \
            --workflow ".github/workflows/publish.yml" \
            --source-sha "$GITHUB_SHA" \
            --source-ref "$GITHUB_REF" \
            --release-asset-list "$RUNNER_TEMP/release-assets.txt" \
            --artifacts artifacts

      - name: Login to NuGet.org (Trusted Publishing → short-lived key)
        id: nuget-login
        if: ${{ !inputs.dry_run }}
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        with:
          user: ilia-sokolov

      - name: Push
        if: ${{ !inputs.dry_run }}
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          for pkg in artifacts/*.nupkg; do
            if [[ "$pkg" == *OfficeAgent.Mcp.* ]]; then
              continue
            fi
            dotnet nuget push "$pkg" \
              --api-key "$NUGET_API_KEY" \
              --source https://api.nuget.org/v3/index.json \
              --skip-duplicate
          done

          for pkg in artifacts/OfficeAgent.Mcp.*.nupkg; do
            dotnet nuget push "$pkg" \
              --api-key "$NUGET_API_KEY" \
              --source https://api.nuget.org/v3/index.json \
              --skip-duplicate
          done

      - name: Log in to GHCR
        if: ${{ !inputs.dry_run }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build and publish validated container image
        id: container
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          # A dry run still builds the image, so a broken Dockerfile shows up before the tag.
          push: ${{ !inputs.dry_run }}
          provenance: mode=max
          sbom: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/officeagent-mcp:${{ steps.release.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/officeagent-mcp:latest

      - name: Attest container build provenance
        if: ${{ !inputs.dry_run }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/officeagent-mcp
          subject-digest: ${{ steps.container.outputs.digest }}
          push-to-registry: true

      - name: Dry run summary
        if: ${{ inputs.dry_run }}
        run: |
          {
            echo "### Dry run of v${{ steps.release.outputs.version }}: nothing was published"
            echo
            echo "Built, tested, packed, packaged and verified from \`$GITHUB_REF\` at \`$GITHUB_SHA\`."
            echo "Skipped: attestations, release assets, NuGet push, container push."
            echo
            ls -1 artifacts | sed 's/^/- /'
          } >> "$GITHUB_STEP_SUMMARY"
