name: publish python

# Publishes the officeagent-mcp wheels to PyPI for an existing release. The wheels are built
# from that release's standalone archives, never rebuilt from source: each archive must match
# the release's SHA256SUMS and carry the build attestation of the publish workflow that made it.
# Every platform the runners cover installs its wheel and runs the server before anything is
# uploaded, and PyPI receives the wheels through trusted publishing with its own attestations.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Existing release version without v, for example 1.2.0'
        required: true
      publish:
        description: 'Upload to PyPI after the wheels pass. Leave off to build and test only.'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.x'

      - name: Check the version names a published release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]]; then
            echo "version must be major.minor.patch, optionally with -rc.N" >&2
            exit 1
          fi
          gh release view "v$VERSION" --json isDraft --jq 'if .isDraft then error("v'"$VERSION"' is still a draft") else "release v'"$VERSION"' found" end'

      - name: Download the release's standalone archives
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release download "v$VERSION" --dir release
          --pattern 'officeagent-mcp-*.zip' --pattern 'officeagent-mcp-*.tar.gz' --pattern SHA256SUMS

      - name: Verify each archive's build attestation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for archive in release/officeagent-mcp-*.zip release/officeagent-mcp-*.tar.gz; do
            gh attestation verify "$archive" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/publish.yml" \
              --source-ref "refs/tags/v$VERSION" > /dev/null
            echo "attested: $(basename "$archive")"
          done

      - name: Test the wheel builder
        run: python -m unittest tests/test_package_wheels.py -v

      - name: Build the wheels
        run: python scripts/package_wheels.py --artifacts release --version "$VERSION" --output dist

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels
          path: dist
          retention-days: 30

  smoke:
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.x'

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wheels
          path: dist

      - name: Install this machine's wheel and run the server through it
        run: python scripts/smoke_python_wheel.py --wheels dist --version "${{ inputs.version }}"

  publish:
    needs: smoke
    if: ${{ inputs.publish }}
    runs-on: ubuntu-latest
    environment: pypi     # matches the PyPI trusted publisher; enables approval gating
    permissions:
      id-token: write     # PyPI trusted publishing and its attestations
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wheels
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist
