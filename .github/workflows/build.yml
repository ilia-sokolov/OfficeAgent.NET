name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      CI: true

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # required for Source Link / deterministic builds

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Validate documentation
        if: matrix.os == 'ubuntu-latest'
        run: python scripts/validate_docs.py

      - name: Test skill packaging, agent evaluation, and release inventory
        if: matrix.os == 'ubuntu-latest'
        run: python -m unittest tests/test_agent_evaluation.py tests/test_package_skills.py tests/test_release_evidence.py tests/test_smoke_packaged_artifacts.py tests/test_benchmark_report.py tests/test_byte_exact_fixtures.py -v

      - name: Validate MCP Registry manifest
        if: matrix.os == 'ubuntu-latest'
        run: |
          python -m pip install --disable-pip-version-check jsonschema==4.25.1
          python scripts/validate_server_manifest.py

      - name: Restore
        run: dotnet restore OfficeAgent.NET.sln

      - name: Audit NuGet dependencies
        if: matrix.os == 'ubuntu-latest'
        run: python scripts/check_vulnerable_packages.py

      - name: Build (both TFM legs)
        run: dotnet build OfficeAgent.NET.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test OfficeAgent.NET.sln --no-build --configuration Release --logger "trx" --results-directory ./TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: ./TestResults

      - name: Pack
        run: dotnet pack OfficeAgent.NET.sln --no-build --configuration Release --output ./artifacts

      # Runs on every platform. Packaging, tool startup and runtime assembly loading
      # are exactly what differs per OS, so a Linux-only check would not see them.
      # This uses the locally packed feed; it proves packaging, not publication.
      - name: Smoke packaged artifacts
        run: python scripts/smoke_packaged_artifacts.py --artifacts ./artifacts

      - name: Package agent skills
        if: matrix.os == 'ubuntu-latest'
        run: python scripts/package_skills.py --output ./artifacts

      - name: Verify integration kit with installed packages
        if: matrix.os == 'ubuntu-latest'
        run: python scripts/verify_integration_kit.py --artifacts ./artifacts

      - name: Upload packages and skills
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: nupkgs
          path: |
            ./artifacts/*.nupkg
            ./artifacts/*.zip
