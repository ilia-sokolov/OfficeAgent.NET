name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      candidate_version:
        description: 'Release-candidate package version to pack and verify on every platform, for example 1.0.0-rc.4. Empty runs the ordinary build only.'
        required: false
        default: ''

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      CI: true

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0   # required for Source Link / deterministic builds

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 8.0.x

      - name: Validate documentation
        if: matrix.os == 'ubuntu-latest'
        run: python scripts/validate_docs.py

      - name: Test skill packaging, agent evaluation, and release inventory
        if: matrix.os == 'ubuntu-latest'
        run: python -m unittest tests/test_agent_evaluation.py tests/test_package_samples.py tests/test_package_skills.py tests/test_release_evidence.py tests/test_smoke_packaged_artifacts.py tests/test_benchmark_report.py tests/test_byte_exact_fixtures.py tests/test_support_policy.py tests/test_verify_candidate_consumer.py -v

      - name: Validate MCP Registry manifest
        if: matrix.os == 'ubuntu-latest'
        run: |
          python -m pip install --disable-pip-version-check jsonschema==4.25.1
          python scripts/validate_server_manifest.py

      - name: Restore
        run: dotnet restore OfficeAgent.NET.sln

      - name: Audit NuGet dependencies
        if: matrix.os == 'ubuntu-latest'
        run: python scripts/check_vulnerable_packages.py

      - name: Build (both TFM legs)
        run: dotnet build OfficeAgent.NET.sln --no-restore --configuration Release

      - name: Verify generated C# API reference
        if: matrix.os == 'ubuntu-latest'
        run: dotnet run --project tools/OfficeAgent.ApiDocs --configuration Release --no-build -- --check docs/csharp-api.md docs/wire-contract.md

      - name: Test
        run: dotnet test OfficeAgent.NET.sln --no-build --configuration Release --logger "trx" --results-directory ./TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-results-${{ matrix.os }}
          path: ./TestResults

      - name: Pack
        run: dotnet pack OfficeAgent.NET.sln --no-build --configuration Release --output ./artifacts

      - name: Package standalone QuickEdit sample
        run: python scripts/package_samples.py --output ./artifacts

      - name: Verify standalone QuickEdit sample with installed packages
        run: python scripts/verify_quickedit_sample.py --artifacts ./artifacts

      # Runs on every platform. Packaging, tool startup and runtime assembly loading
      # are exactly what differs per OS, so a Linux-only check would not see them.
      # This uses the locally packed feed; it proves packaging, not publication.
      - name: Smoke packaged artifacts
        run: python scripts/smoke_packaged_artifacts.py --artifacts ./artifacts

      # Stored v0.8 and v0.9 plans, receipts and preservation cases, run through the installed
      # packages: what earlier releases promised, as a consumer sees it.
      - name: Verify stored records with installed packages
        run: python scripts/verify_candidate_consumer.py --artifacts ./artifacts

      - name: Package agent skills
        if: matrix.os == 'ubuntu-latest'
        run: python scripts/package_skills.py --output ./artifacts

      - name: Verify integration kit with installed packages
        if: matrix.os == 'ubuntu-latest'
        run: python scripts/verify_integration_kit.py --artifacts ./artifacts

      - name: Upload packages and skills
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nupkgs
          path: |
            ./artifacts/*.nupkg
            ./artifacts/*.zip

  runtime-dotnet10:
    # .NET 8 support ends 2026-11-10; .NET 10 is the LTS after it. The libraries keep their
    # netstandard2.0 and net8.0 targets, which a .NET 10 application consumes, so this leg builds
    # with the pinned .NET 8 SDK and runs the same tests and the packaged smoke on the .NET 10
    # runtime. OFFICEAGENT_EXPECT_RUNTIME_MAJOR makes a test fail if the roll-forward did not happen.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      CI: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Build with the pinned SDK
        run: dotnet build OfficeAgent.NET.sln --configuration Release

      - name: Test on the .NET 10 runtime
        env:
          DOTNET_ROLL_FORWARD: LatestMajor
          OFFICEAGENT_EXPECT_RUNTIME_MAJOR: "10"
        run: dotnet test OfficeAgent.NET.sln --no-build --configuration Release

      - name: Pack
        run: dotnet pack OfficeAgent.NET.sln --no-build --configuration Release --output ./artifacts

      - name: Smoke packaged artifacts on the .NET 10 runtime
        env:
          DOTNET_ROLL_FORWARD: LatestMajor
        run: python scripts/smoke_packaged_artifacts.py --artifacts ./artifacts

  candidate-packages:
    # Installed-package evidence for an explicit release candidate. The ordinary build packs the
    # committed version, so it is branch evidence, not candidate evidence: a candidate is packed here
    # at exactly the requested version, and every verifier is told that version rather than inferring
    # it. Runs only when a candidate_version is dispatched.
    if: github.event_name == 'workflow_dispatch' && inputs.candidate_version != ''
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, runtime: '8' }
          - { os: windows-latest, runtime: '8' }
          - { os: macos-latest, runtime: '8' }
          - { os: ubuntu-latest, runtime: '10' }
          - { os: windows-latest, runtime: '10' }
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      CI: true
      CANDIDATE_VERSION: ${{ inputs.candidate_version }}
      OFFICEAGENT_EXPECT_RUNTIME_MAJOR: ${{ matrix.runtime }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Validate the candidate version
        run: |
          if [[ ! "$CANDIDATE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "candidate_version must be major.minor.patch with an optional prerelease label" >&2
            exit 1
          fi
          echo "candidate $CANDIDATE_VERSION at $GITHUB_SHA on $RUNNER_OS, .NET $OFFICEAGENT_EXPECT_RUNTIME_MAJOR runtime"

      - name: Pack every package at the candidate version
        run: dotnet pack OfficeAgent.NET.sln --configuration Release -p:Version="$CANDIDATE_VERSION" --output ./candidate

      - name: Require exactly the nine candidate packages
        run: |
          for id in Abstractions AgentFramework Core Excel Mcp PowerPoint Rendering SharePoint Word; do
            test -f "candidate/OfficeAgent.$id.$CANDIDATE_VERSION.nupkg" || { echo "missing OfficeAgent.$id.$CANDIDATE_VERSION.nupkg" >&2; exit 1; }
          done
          count=$(ls candidate/*.nupkg | wc -l)
          test "$count" -eq 9 || { echo "expected 9 packages, found $count" >&2; exit 1; }

      - name: Run installed packages on the .NET 10 runtime
        if: matrix.runtime == '10'
        run: echo "DOTNET_ROLL_FORWARD=LatestMajor" >> "$GITHUB_ENV"

      - name: Smoke the installed candidate (stdio, serverInfo and /healthz versions)
        run: python scripts/smoke_packaged_artifacts.py --artifacts ./candidate --version "$CANDIDATE_VERSION"

      - name: Verify stored records and exact assembly versions with the installed candidate
        run: python scripts/verify_candidate_consumer.py --artifacts ./candidate --version "$CANDIDATE_VERSION"

      - name: Verify the QuickEdit sample with the installed candidate
        run: |
          python scripts/package_samples.py --output ./candidate --version "$CANDIDATE_VERSION"
          python scripts/verify_quickedit_sample.py --artifacts ./candidate --version "$CANDIDATE_VERSION"

      - name: Verify the integration kit with the installed candidate
        run: |
          python scripts/package_skills.py --output ./candidate
          python scripts/verify_integration_kit.py --artifacts ./candidate --version "$CANDIDATE_VERSION"

  renderer-sandbox:
    # The sandboxed renderer reference (deploy/renderer). It needs a Linux container engine,
    # which only the Ubuntu runners provide, so it runs here rather than in the build matrix.
    # The tests build the reference and control images and fail, never skip, without Docker.
    runs-on: ubuntu-latest
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      CI: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 8.0.x

      - name: Renderer sandbox reference tests
        run: dotnet test tests/OfficeAgent.RenderSandbox.Tests --configuration Release --logger "trx" --results-directory ./TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-results-renderer-sandbox
          path: ./TestResults
